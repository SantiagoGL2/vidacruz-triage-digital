# Configuracion base de clinical-assistant-service. Todo parametrizable por variables de entorno.
# Los secretos (REDIS_PASSWORD, ASSISTANT_API_KEY, LLM_API_KEY) NO tienen valor por defecto: vienen del entorno (.env).
spring:
  application:
    name: clinical-assistant-service
  profiles:
    default: local
  reactor:
    # Copia el Context de Reactor (correlationId) al MDC en cada operador: logs con correlationId sin ThreadLocal manual.
    context-propagation: auto
  autoconfigure:
    exclude:
      # La autenticacion es por API key (X-API-Key); no se genera usuario/clave en memoria.
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      # Spring AI (modelo OpenAI + vector store en Redis Stack) llega con el RAG (RF-04 parte A). Mientras tanto no se
      # autoconfigura: el vector store exige Redis Stack en el arranque y el modelo una LLM_API_KEY. Quitar estas lineas al implementarlo.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Con Redis caido un comando no debe colgarse (el timeout por defecto de Lettuce es 60 s): falla rapido y el
      # consumidor reintenta con backoff / la API responde 503.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # earliest: un despliegue nuevo (grupo sin offsets) reconstruye la vista desde el inicio del topic.
      # Requiere que el topic conserve los eventos (retencion): ver docs/supuestos.md.
      auto-offset-reset: earliest
      enable-auto-commit: false
      # Los deserializadores (ErrorHandlingDeserializer + JSON) se construyen en KafkaConsumerConfig.
    listener:
      ack-mode: record     # el offset se confirma por registro, solo despues de que Redis termino (ver EventosTriajeKafkaListener)
      concurrency: ${ASSISTANT_KAFKA_CONCURRENCY:1}
    producer:   # solo para publicar a la DLT; los serializadores se fijan en KafkaConsumerConfig
      acks: all
      properties:
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
  ai:
    # Proveedor OpenAI-compatible (OpenAI, Azure OpenAI via gateway, Groq, vLLM, Ollama...). Cambia LLM_BASE_URL.
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.0          # respuestas deterministas: anti-alucinacion (RN-05)
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      redis:
        # Requiere Redis Stack (modulo RediSearch). La URI incluye la clave: formato redis://:password@host:port
        uri: redis://:${REDIS_PASSWORD}@${REDIS_HOST:localhost}:${REDIS_PORT:6379}
        index-name: ${ASSISTANT_VECTOR_INDEX:protocolos-idx}
        prefix: ${ASSISTANT_VECTOR_PREFIX:protocolo:}
        initialize-schema: ${ASSISTANT_VECTOR_INIT_SCHEMA:true}

# Documentacion OpenAPI y Swagger UI. En produccion se apagan con SWAGGER_HABILITADO=false (los perfiles
# local y docker la encienden por defecto).
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      # JSON estructurado nativo de Boot (incluye MDC: correlationId, traceId, spanId). Vacio = texto plano.
      console: ${LOG_FORMAT:logstash}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.vidacruz: ${LOG_LEVEL_APP:INFO}

# ---------------------------------------------------------------------------
# Resilience4j sobre el proveedor LLM (instancia "llm"):
# CircuitBreaker + Retry (solo transitorios: timeout, 5xx, 429 -> se fija por clase en codigo) + TimeLimiter + Bulkhead.
# Fallback: HTTP 503 con mensaje claro (modo degradado).
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      llm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${LLM_CB_WINDOW:20}
        minimum-number-of-calls: ${LLM_CB_MIN_CALLS:10}
        failure-rate-threshold: ${LLM_CB_FAILURE_RATE:50}
        slow-call-duration-threshold: ${LLM_CB_SLOW_CALL:8s}
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: ${LLM_CB_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  retry:
    instances:
      llm:
        max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${LLM_RETRY_WAIT:500ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      llm:
        timeout-duration: ${LLM_TIMEOUT:15s}
        cancel-running-future: true
  bulkhead:
    instances:
      llm:
        max-concurrent-calls: ${LLM_BULKHEAD_MAX_CALLS:10}
        max-wait-duration: 0

# ---------------------------------------------------------------------------
# Propiedades de negocio / operacion del asistente
# ---------------------------------------------------------------------------
assistant:
  security:
    api-key-header: X-API-Key
    api-key: ${ASSISTANT_API_KEY}
  # RF-04 parte B: consumo de los eventos de triage (nunca se llama a la API de triage)
  kafka:
    habilitado: ${ASSISTANT_KAFKA_HABILITADO:true}
    topic: ${TRIAGE_KAFKA_TOPIC:triaje.eventos}
    dlt-topic: ${TRIAGE_KAFKA_DLT_TOPIC:triaje.eventos.DLT}
    group-id: ${ASSISTANT_KAFKA_GROUP_ID:asistente-estado-urgencias}
    # Tope de espera por evento en el hilo del consumidor (Redis ya corta a los 2 s; esto es un seguro)
    timeout-procesamiento: ${ASSISTANT_KAFKA_TIMEOUT:30s}
    # Errores transitorios (Redis caido): backoff exponencial; agotado el tiempo, el mensaje va a la DLT
    retry:
      initial-interval: ${ASSISTANT_RETRY_INITIAL:1s}
      multiplier: 2.0
      max-interval: ${ASSISTANT_RETRY_MAX_INTERVAL:30s}
      max-elapsed-time: ${ASSISTANT_RETRY_MAX_ELAPSED:5m}
  # Vista materializada de estado-urgencias en Redis. El prefijo evita chocar con el vector store del RAG (mismo Redis).
  estado-urgencias:
    key-prefix: ${ASSISTANT_REDIS_PREFIX:asistente:urgencias:}
    ttl-deduplicacion: ${ASSISTANT_DEDUP_TTL:P7D}      # cuanto se recuerda un eventId ya procesado
    zona-horaria: ${ASSISTANT_ZONA_HORARIA:America/Bogota}
  # RAG
  rag:
    top-k: ${ASSISTANT_RAG_TOP_K:4}
    similarity-threshold: ${ASSISTANT_RAG_SIMILARITY_THRESHOLD:0.65}   # bajo este umbral -> "no existe protocolo disponible" (RN-05)
    ingest-on-startup: ${ASSISTANT_RAG_INGEST_ON_STARTUP:true}
