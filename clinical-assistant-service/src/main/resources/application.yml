# Configuracion base de clinical-assistant-service. Todo parametrizable por variables de entorno.
# Los secretos (REDIS_PASSWORD, ASSISTANT_API_KEY, LLM_API_KEY) NO tienen valor por defecto: vienen del entorno (.env).
spring:
  application:
    name: clinical-assistant-service
  profiles:
    default: local
  messages:
    # Textos de los errores de la API (messages.properties). Sin fallback al idioma del sistema: si no hay
    # messages_<idioma>.properties para el Accept-Language de la peticion, se usa siempre el espanol (messages.properties).
    basename: messages
    fallback-to-system-locale: false
  reactor:
    # Copia el Context de Reactor (correlationId) al MDC en cada operador: logs con correlationId sin ThreadLocal manual.
    context-propagation: auto
  autoconfigure:
    exclude:
      # La autenticacion es por API key (X-API-Key); no se genera usuario/clave en memoria.
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      # Spring AI: se usan el modelo de chat y el de embeddings de OpenAI (autoconfigurados). Se excluye lo que no se usa
      # (imagen, audio, moderacion) y el vector store de Redis: su autoconfiguracion en 1.1 exige un JedisConnectionFactory,
      # no declara los campos de metadatos y crea el indice en el arranque (tumbaria la app si Redis o el proveedor fallan).
      # El vector store se arma en RagConfig y el indice lo crea la indexacion en segundo plano.
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  http:
    client:
      # Timeouts del cliente HTTP hacia el proveedor (RestClient de Spring AI): un hilo no queda colgado si el proveedor no responde
      connect-timeout: ${LLM_HTTP_CONNECT_TIMEOUT:3s}
      read-timeout: ${LLM_HTTP_READ_TIMEOUT:30s}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # Con Redis caido un comando no debe colgarse (el timeout por defecto de Lettuce es 60 s): falla rapido y el
      # consumidor reintenta con backoff / la API responde 503.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      # earliest: un despliegue nuevo (grupo sin offsets) reconstruye la vista desde el inicio del topic.
      # Requiere que el topic conserve los eventos (retencion): ver docs/supuestos.md.
      auto-offset-reset: earliest
      enable-auto-commit: false
      # Los deserializadores (ErrorHandlingDeserializer + JSON) se construyen en KafkaConsumerConfig.
    listener:
      ack-mode: record     # el offset se confirma por registro, solo despues de que Redis termino (ver EventosTriajeKafkaListener)
      concurrency: ${ASSISTANT_KAFKA_CONCURRENCY:1}
    producer:   # solo para publicar a la DLT; los serializadores se fijan en KafkaConsumerConfig
      acks: all
      properties:
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
  ai:
    # Proveedor OpenAI-compatible (OpenAI, Azure OpenAI via gateway, Groq, vLLM, Ollama...). Cambia LLM_BASE_URL.
    openai:
      api-key: ${LLM_API_KEY}
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.0          # respuestas deterministas: anti-alucinacion (RN-05)
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
    retry:
      # Los reintentos los hace Resilience4j (solo ante errores transitorios, con circuit breaker): el RetryTemplate
      # interno de Spring AI (10 intentos, espera de hasta 3 min) se desactiva para que no se acumulen ambos.
      max-attempts: 1

# Documentacion OpenAPI y Swagger UI. En produccion se apagan con SWAGGER_HABILITADO=false (los perfiles
# local y docker la encienden por defecto).
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # indiceProtocolos: UP cuando el indice del RAG esta indexado. Los circuit breakers NO estan aqui: un LLM caido
          # no saca al servicio de la rotacion (la vista de urgencias sigue sirviendose).
          include: readinessState,redis,indiceProtocolos
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      # JSON estructurado nativo de Boot (incluye MDC: correlationId, traceId, spanId). Vacio = texto plano.
      console: ${LOG_FORMAT:logstash}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.vidacruz: ${LOG_LEVEL_APP:INFO}

# ---------------------------------------------------------------------------
# Resilience4j sobre el proveedor LLM (instancia "llm"):
# CircuitBreaker + Retry (solo transitorios: timeout, 5xx, 429 -> se fija por clase en codigo) + TimeLimiter + Bulkhead.
# Fallback: HTTP 503 con mensaje claro (modo degradado).
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      llm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${LLM_CB_WINDOW:20}
        minimum-number-of-calls: ${LLM_CB_MIN_CALLS:10}
        failure-rate-threshold: ${LLM_CB_FAILURE_RATE:50}
        slow-call-duration-threshold: ${LLM_CB_SLOW_CALL:10s}
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: ${LLM_CB_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false     # el estado se ve en /actuator/circuitbreakers y en Prometheus
        # un fallo de Redis (no del proveedor) o un bulkhead lleno no cuentan como fallo del proveedor
        ignore-exceptions:
          - redis.clients.jedis.exceptions.JedisException
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      llm-chat:
        base-config: llm
      llm-embedding:
        base-config: llm
  retry:
    configs:
      llm:
        max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${LLM_RETRY_WAIT:500ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true          # jitter
        randomized-wait-factor: 0.3
        # solo transitorios: timeout, conexion/E-S, 5xx y 429. Nunca 4xx de configuracion ni errores de validacion
        retry-exception-predicate: com.vidacruz.assistant.infrastructure.drivenadapter.ai.resilience.ErrorTransitorioProveedor
    instances:
      llm-chat:
        base-config: llm
      llm-embedding:
        base-config: llm
  timelimiter:
    configs:
      llm:
        timeout-duration: ${LLM_TIMEOUT:20s}
        cancel-running-future: true
    instances:
      llm-chat:
        base-config: llm
      llm-embedding:
        base-config: llm
  bulkhead:
    configs:
      llm:
        max-concurrent-calls: ${LLM_BULKHEAD_MAX_CALLS:10}
        max-wait-duration: 0
    instances:
      llm-chat:
        base-config: llm
      llm-embedding:
        base-config: llm

# ---------------------------------------------------------------------------
# Propiedades de negocio / operacion del asistente
# ---------------------------------------------------------------------------
assistant:
  security:
    api-key-header: X-API-Key
    api-key: ${ASSISTANT_API_KEY}
  # RF-04 parte B: consumo de los eventos de triage (nunca se llama a la API de triage)
  kafka:
    habilitado: ${ASSISTANT_KAFKA_HABILITADO:true}
    topic: ${TRIAGE_KAFKA_TOPIC:triaje.eventos}
    dlt-topic: ${TRIAGE_KAFKA_DLT_TOPIC:triaje.eventos.DLT}
    group-id: ${ASSISTANT_KAFKA_GROUP_ID:asistente-estado-urgencias}
    # Tope de espera por evento en el hilo del consumidor (Redis ya corta a los 2 s; esto es un seguro)
    timeout-procesamiento: ${ASSISTANT_KAFKA_TIMEOUT:30s}
    # Errores transitorios (Redis caido): backoff exponencial; agotado el tiempo, el mensaje va a la DLT
    retry:
      initial-interval: ${ASSISTANT_RETRY_INITIAL:1s}
      multiplier: 2.0
      max-interval: ${ASSISTANT_RETRY_MAX_INTERVAL:30s}
      max-elapsed-time: ${ASSISTANT_RETRY_MAX_ELAPSED:5m}
  # Vista materializada de estado-urgencias en Redis. El prefijo evita chocar con el vector store del RAG (mismo Redis).
  estado-urgencias:
    key-prefix: ${ASSISTANT_REDIS_PREFIX:asistente:urgencias:}
    ttl-deduplicacion: ${ASSISTANT_DEDUP_TTL:P7D}      # cuanto se recuerda un eventId ya procesado
    zona-horaria: ${ASSISTANT_ZONA_HORARIA:America/Bogota}
  # RAG
  # RF-04 parte A: consulta de protocolos con RAG (RN-05)
  rag:
    top-k: ${ASSISTANT_RAG_TOP_K:4}
    # Barrera 1: similitud minima (0..1) para que un fragmento cuente como relevante. Ver docs/asistente-rag.md.
    similarity-threshold: ${ASSISTANT_RAG_SIMILARITY_THRESHOLD:0.75}
    mensaje-sin-protocolo: ${ASSISTANT_RAG_MENSAJE_SIN_PROTOCOLO:No existe un protocolo disponible en el corpus oficial para responder esta pregunta.}
    # Un archivo Markdown por protocolo. Para agregar uno: soltar el archivo en resources/protocolos (o apuntar a un directorio).
    corpus: ${ASSISTANT_RAG_CORPUS:classpath:protocolos/*.md}
    ingest-on-startup: ${ASSISTANT_RAG_INGEST_ON_STARTUP:true}
    # Modelo de los vectores del indice; entra en el hash de los fragmentos (cambiarlo reindexa). Debe coincidir con el de Spring AI.
    modelo-embeddings: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
    indice:
      nombre: ${ASSISTANT_RAG_INDICE:asistente-protocolos-idx}
      prefijo: ${ASSISTANT_RAG_PREFIJO:asistente:protocolo:}      # distinto del prefijo de la vista de urgencias
    ingesta:
      backoff-inicial: ${ASSISTANT_RAG_BACKOFF_INICIAL:2s}
      backoff-maximo: ${ASSISTANT_RAG_BACKOFF_MAXIMO:1m}
    retry-after:
      proveedor: ${ASSISTANT_RAG_RETRY_AFTER_PROVEEDOR:30s}      # header Retry-After del 503 por proveedor caido
      indice: ${ASSISTANT_RAG_RETRY_AFTER_INDICE:10s}            # ... y del 503 por indice en construccion
