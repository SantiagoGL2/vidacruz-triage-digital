# Textos que ve el usuario en los errores de la API (ProblemDetail). Idioma por defecto: espanol.
# Para otro idioma, agregar messages_<idioma>.properties con las mismas claves (se elige con Accept-Language).
# Catalogo de errores y su type URI: docs/errores.md y ErrorApi. Claves: error.<codigo>.titulo / error.<codigo>.mensaje.
# Cuidado: los mensajes con argumentos usan MessageFormat; no uses apostrofes simples sin duplicarlos.

error.validacion.titulo=Datos invalidos
error.validacion.mensaje=Hay {0} dato(s) invalido(s): {1}

error.json-malformado.titulo=JSON malformado
error.json-malformado.mensaje=El cuerpo no es un JSON valido

error.solicitud-invalida.titulo=Solicitud invalida
error.solicitud-invalida.mensaje=La solicitud no se pudo interpretar (cuerpo ausente o ilegible)

error.no-autenticado.titulo=No autenticado
error.no-autenticado.mensaje=Falta el header {0} o su valor no es valido

error.asistente-no-disponible.titulo=Asistente clínico no disponible
error.asistente-no-disponible.mensaje=El asistente clínico no está disponible temporalmente; consulte los protocolos impresos

error.indice-no-disponible.titulo=Índice de protocolos no disponible
error.indice-no-disponible.mensaje=El asistente clínico se está preparando (indexando los protocolos); reintente en unos segundos. Mientras tanto, consulte los protocolos impresos

error.indice-no-disponible.mensaje-fallido=La indexación de los protocolos falló y se reintenta automáticamente; reintente en unos segundos. Mientras tanto, consulte los protocolos impresos

error.estado-no-disponible.titulo=Estado de urgencias no disponible
error.estado-no-disponible.mensaje=La vista de urgencias no esta disponible temporalmente (el almacen Redis no responde). Reintenta en unos segundos.

error.interno.titulo=Error interno
error.interno.mensaje=Ocurrio un error interno. Reporta el correlationId al equipo de soporte.

error.http.titulo=Error

# Mensajes por campo (errores[].mensaje)
campo.obligatorio=campo obligatorio
campo.invalido=valor invalido ({0})
campo.tipo-invalido=tipo o valor invalido
campo.cuerpo=(cuerpo)
consulta.pregunta.obligatoria=campo obligatorio y no puede estar en blanco
consulta.pregunta.longitud=debe tener entre {min} y {max} caracteres

# Descripcion del estado del indice de protocolos (detalle "descripcion" del health)
indice.estado.indexando=Indexando los protocolos; aun no termino la primera indexacion
indice.estado.listo=Indice de protocolos listo
indice.estado.fallido=La ultima indexacion de protocolos fallo; se reintenta con backoff
