# Perfil de pruebas. Redis y Kafka los inyectan los Testcontainers (@DynamicPropertySource); el proveedor de IA es un
# WireMock que imita la API de OpenAI (su URL tambien se inyecta). Umbrales bajos para que los tests de resiliencia sean rapidos.
spring:
  data:
    redis:
      password: test-only
  kafka:
    producer:
      properties:
        # La DLT debe responder rapido incluso en los tests de fallo
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
  ai:
    openai:
      api-key: ${LLM_API_KEY:test-only-key}
      base-url: ${LLM_BASE_URL:http://localhost:9}      # los tests con proveedor simulado lo sustituyen
  http:
    client:
      read-timeout: 1s     # < timelimiter (1500ms), como exige PresupuestoTiempoLlmValidador
assistant:
  security:
    api-key: test-api-key
  rate-limit:
    peticiones: 100000      # los tests no deben toparse con el limite; RateLimitTests lo fija bajo en su propio contexto
  kafka:
    # Backoff corto para que "Redis caido y vuelve" se pruebe en segundos
    retry:
      initial-interval: 200ms
      multiplier: 2.0
      max-interval: 1s
      max-elapsed-time: 2m
  estado-urgencias:
    ttl-deduplicacion: PT1H
  rag:
    ingest-on-startup: true
    ingesta:
      backoff-inicial: 200ms
      backoff-maximo: 1s
    retry-after:
      proveedor: 7s
      indice: 3s
resilience4j:
  circuitbreaker:
    configs:
      llm:
        sliding-window-size: 6
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        slow-call-duration-threshold: 5s
  retry:
    configs:
      llm:
        max-attempts: 2
        wait-duration: 50ms
        exponential-backoff-multiplier: 1.5
  timelimiter:
    configs:
      llm:
        timeout-duration: 1500ms
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
management:
  otlp:
    tracing:
      export:
        enabled: false
logging:
  structured:
    format:
      console:
