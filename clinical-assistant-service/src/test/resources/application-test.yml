# Perfil de pruebas. Redis y Kafka los inyectan los Testcontainers (@DynamicPropertySource).
spring:
  data:
    redis:
      password: test-only
  kafka:
    producer:
      properties:
        # La DLT debe responder rapido incluso en los tests de fallo
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
assistant:
  security:
    api-key: test-api-key
  kafka:
    # Backoff corto para que "Redis caido y vuelve" se pruebe en segundos
    retry:
      initial-interval: 200ms
      multiplier: 2.0
      max-interval: 1s
      max-elapsed-time: 2m
  estado-urgencias:
    ttl-deduplicacion: PT1H
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
management:
  otlp:
    tracing:
      export:
        enabled: false
logging:
  structured:
    format:
      console:
