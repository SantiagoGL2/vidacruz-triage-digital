apiVersion: v1
kind: Service
metadata:
  name: clinical-assistant-service
  labels:
    app.kubernetes.io/name: clinical-assistant-service
spec:
  # ClusterIP en la base; el overlay de Azure lo cambia a LoadBalancer.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clinical-assistant-service
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-assistant-service
  labels:
    app.kubernetes.io/name: clinical-assistant-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clinical-assistant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinical-assistant-service
    spec:
      # REDIS_PORT=tcp://... (inyectada por Kubernetes para el Service "redis") rompe ${REDIS_PORT:6379}.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: esperar-dependencias
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              for destino in redis:6379 kafka:9092; do
                host=${destino%:*}; puerto=${destino#*:}
                until nc -z -w 2 "$host" "$puerto"; do echo "esperando a $host:$puerto"; sleep 2; done
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: clinical-assistant-service
          image: vidacruz/clinical-assistant-service:dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: assistant-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: REDIS_PASSWORD
            - name: ASSISTANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: ASSISTANT_API_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: LLM_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Arranque mas largo que triage: la indexacion de protocolos corre en segundo plano (no bloquea liveness).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness incluye redis e indiceProtocolos: no recibe trafico hasta que el indice del RAG esta listo.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
