# Job de un solo uso (equivale a "kafka-init" de docker-compose): crea los topics y termina. Es idempotente
# (--if-not-exists). Un Job no se puede modificar una vez creado: infra/deploy.* lo borra antes de aplicar.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    app.kubernetes.io/name: kafka-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crear-topics
          image: apache/kafka:3.9.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              B=/opt/kafka/bin
              # Espera a que el broker responda (el Job puede arrancar antes que Kafka).
              until $B/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do
                echo "esperando a kafka:9092..."; sleep 3
              done
              $B/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic triaje.eventos --partitions 3 --replication-factor 1
              $B/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic triaje.eventos.DLT --partitions 3 --replication-factor 1
              $B/kafka-topics.sh --bootstrap-server kafka:9092 --list
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xmx128m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
