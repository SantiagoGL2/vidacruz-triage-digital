# Redis Stack (RediSearch para el vector store del RAG + la vista de urgencias). Se usa la variante "-server" (sin
# RedisInsight, que en docker-compose es solo comodidad local) para ahorrar memoria. Solo ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      # Sin REDIS_PORT=tcp://... inyectada: rompe la configuracion ${REDIS_PORT:6379} del asistente.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis/redis-stack-server:7.4.0-v3
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: REDIS_PASSWORD
            # $(REDIS_PASSWORD) lo expande Kubernetes (la variable esta definida arriba). maxmemory < limite del pod:
            # Redis rechaza escrituras antes de que el kernel mate el contenedor.
            - name: REDIS_ARGS
              value: --requirepass $(REDIS_PASSWORD) --appendonly yes --dir /data --maxmemory 400mb --maxmemory-policy noeviction
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: REDIS_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 640Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
