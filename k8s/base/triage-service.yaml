apiVersion: v1
kind: Service
metadata:
  name: triage-service
  labels:
    app.kubernetes.io/name: triage-service
spec:
  # ClusterIP en la base; el overlay de Azure lo cambia a LoadBalancer.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: triage-service
  ports:
    - name: http
      port: 80
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  labels:
    app.kubernetes.io/name: triage-service
spec:
  replicas: 1
  # Un solo nodo y sin cuota para un pod extra: primero se detiene el viejo, luego arranca el nuevo.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-service
    spec:
      # Kubernetes inyectaria POSTGRES_PORT/KAFKA_PORT=tcp://... y pisaria la configuracion tipada de Spring.
      enableServiceLinks: false
      # preStop (5 s) + cierre ordenado de Spring (SHUTDOWN_TIMEOUT=25 s) < 45 s.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001       # numerico: la imagen declara el usuario "app" por nombre
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Espera a las dependencias (los probes de readiness del servicio hacen el resto).
        - name: esperar-dependencias
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              for destino in postgres:5432 kafka:9092; do
                host=${destino%:*}; puerto=${destino#*:}
                until nc -z -w 2 "$host" "$puerto"; do echo "esperando a $host:$puerto"; sleep 2; done
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: triage-service
          image: vidacruz/triage-service:dev
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: triage-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: POSTGRES_PASSWORD
            - name: TRIAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: TRIAGE_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Arranque (Flyway + warm-ups): hasta 5 s * 36 = 3 min antes de que liveness empiece a contar.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]   # deja que el endpoint salga de los Services antes de cerrar
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
