apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay de Azure (AKS, un nodo). Los marcadores en MAYUSCULAS los sustituye infra/deploy.* al renderizar:
#   ACR_LOGIN_SERVER   <acr>.azurecr.io           IMAGE_TAG   hash corto de git
#   HOST_TRIAGE / HOST_ASISTENTE                  hosts publicos <etiqueta>.eastus.cloudapp.azure.com
#   CLUSTER_ISSUER                                letsencrypt-prod | letsencrypt-staging
# Se hace asi para no versionar nombres propios de la suscripcion.
#
# Los Services de los dos microservicios son ClusterIP (base): lo unico publico es el controlador de ingreso
# (k8s/platform/ingress-nginx) y los Ingress de ingress.yaml, con TLS.
# Todos los recursos del overlay (incluidos los Ingress de ingress.yaml) van en el namespace de la aplicacion. Sin esta linea los Ingress
# se creaban en "default" y no podian apuntar a los Services de "vidacruz" (los backends de un Ingress son del mismo namespace).
namespace: vidacruz

resources:
  - ../../base
  - ingress.yaml

# Todas las imagenes salen del ACR (las de terceros se copian con "az acr import": sin limites de Docker Hub).
images:
  - name: vidacruz/triage-service
    newName: ACR_LOGIN_SERVER/triage-service
    newTag: IMAGE_TAG
  - name: vidacruz/clinical-assistant-service
    newName: ACR_LOGIN_SERVER/clinical-assistant-service
    newTag: IMAGE_TAG
  - name: postgres
    newName: ACR_LOGIN_SERVER/postgres
  - name: apache/kafka
    newName: ACR_LOGIN_SERVER/kafka
  - name: redis/redis-stack-server
    newName: ACR_LOGIN_SERVER/redis-stack-server
  - name: busybox
    newName: ACR_LOGIN_SERVER/busybox

# Un solo nodo: una replica de cada servicio (no hay cuota para mas). Los recursos de la base ya estan dimensionados para
# el B4ms (reparto en docs/despliegue-azure.md).
replicas:
  - name: triage-service
    count: 1
  - name: clinical-assistant-service
    count: 1
