# EJEMPLO de la forma del Secret que esperan los pods. NO lo uses tal cual ni pongas valores reales aqui:
# infra/deploy.ps1|sh lo crea (paso "secretos") a partir de variables de entorno / infra/.env.azure, ambos en .gitignore.
#
#   kubectl -n vidacruz create secret generic vidacruz-secrets --from-env-file=<archivo-con-las-5-claves>
#
# En produccion este Secret se sustituiria por Azure Key Vault + Secrets Store CSI Driver (docs/adr/0008-despliegue-en-aks.md).
apiVersion: v1
kind: Secret
metadata:
  name: vidacruz-secrets
  namespace: vidacruz
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""   # contrasena de PostgreSQL (usuario triage); hex/alfanumerica
  REDIS_PASSWORD: ""      # requirepass de Redis; hex/alfanumerica (va dentro de una URI redis://:clave@host)
  TRIAGE_API_KEY: ""      # header X-API-Key de triage-service
  ASSISTANT_API_KEY: ""   # header X-API-Key de clinical-assistant-service
  LLM_API_KEY: ""         # clave del proveedor de IA (OpenAI-compatible)
