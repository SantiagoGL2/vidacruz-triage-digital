# Ejecucion en la maquina del desarrollador (./gradlew bootRun) contra la infraestructura de docker-compose
# (puertos publicados en localhost). Los secretos (POSTGRES_PASSWORD, TRIAGE_API_KEY...) se leen del .env de la raiz del
# repo; si existe, no hace falta exportarlos. Las variables de entorno reales tienen prioridad sobre el .env.
# ../.env sirve desde la carpeta del servicio (./gradlew bootRun, :triage-service:bootRun); ./.env, desde la raiz.
# OJO: lo que defina el .env (p. ej. TRIAGE_SLA_*) gana sobre los valores por defecto de este perfil.
spring:
  config:
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  structured:
    format:
      console: ${LOG_FORMAT:}   # texto legible en local; exporta LOG_FORMAT=logstash para JSON
  level:
    com.vidacruz: ${LOG_LEVEL_APP:DEBUG}

# SLA cortos y evaluacion frecuente para ver el escalamiento sin esperar (el minimo del dominio es 1 minuto).
triage:
  sla:
    intervalo-evaluacion: ${TRIAGE_SLA_INTERVALO_EVALUACION:PT5S}
    minutos:
      CRITICO: ${TRIAGE_SLA_CRITICO:1}
      URGENTE: ${TRIAGE_SLA_URGENTE:1}
      URGENTE_2: ${TRIAGE_SLA_URGENTE_2:2}
      NO_URGENTE: ${TRIAGE_SLA_NO_URGENTE:3}
      NO_URGENTE_2: ${TRIAGE_SLA_NO_URGENTE_2:5}
  outbox:
    intervalo: ${TRIAGE_OUTBOX_INTERVALO:PT1S}

# Swagger UI y /v3/api-docs encendidos fuera de produccion (SWAGGER_HABILITADO=false para apagarlos).
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}
