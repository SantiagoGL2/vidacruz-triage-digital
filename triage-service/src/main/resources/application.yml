# Configuracion base de triage-service. Todo parametrizable por variables de entorno.
# Los secretos (DB_PASSWORD, TRIAGE_API_KEY) NO tienen valor por defecto: deben venir del entorno o del .env de la raiz
# (perfil local). La base de datos acepta DB_* o los nombres del .env (POSTGRES_PASSWORD, POSTGRES_USER, POSTGRES_DB); DB_* manda.
spring:
  application:
    name: triage-service
  profiles:
    default: local
  messages:
    # Textos de los errores de la API (messages.properties). Sin fallback al idioma del sistema: si no hay
    # messages_<idioma>.properties para el Accept-Language de la peticion, se usa siempre el espanol (messages.properties).
    basename: messages
    fallback-to-system-locale: false
  reactor:
    # Copia el Context de Reactor (correlationId) al MDC en cada operador: logs con correlationId sin ThreadLocal manual.
    context-propagation: auto
  jackson:
    deserialization:
      accept-float-as-int: false      # 72.5 en un campo entero es un 400, no se trunca a 72
    mapper:
      allow-coercion-of-scalars: false  # "72" (string) en un campo numerico es un 400
  autoconfigure:
    exclude:
      # No se genera usuario/clave en memoria: la autenticacion es por API key (X-API-Key).
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:triage}}
    username: ${DB_USER:${POSTGRES_USER:triage}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    pool:
      initial-size: ${DB_POOL_INITIAL:5}
      max-size: ${DB_POOL_MAX:20}
  flyway:
    # Flyway usa JDBC (solo al arrancar); la aplicacion en runtime usa exclusivamente R2DBC.
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${POSTGRES_DB:triage}}
    user: ${DB_USER:${POSTGRES_USER:triage}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
    template:
      observation-enabled: true   # span de publicacion + cabecera traceparent en cada mensaje (traza distribuida)
    listener:
      ack-mode: record     # el offset se confirma por registro, solo cuando el procesamiento termino (ADR 0004)
      observation-enabled: true   # el consumo continua la traza que trae el mensaje
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

# Documentacion OpenAPI y Swagger UI. En produccion se apagan con SWAGGER_HABILITADO=false (los perfiles
# local y docker la encienden por defecto).
springdoc:
  api-docs:
    enabled: ${SWAGGER_HABILITADO:false}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:false}
    path: /swagger-ui.html
    disable-swagger-default-url: true
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,r2dbc
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      # JSON estructurado nativo de Boot (incluye MDC: correlationId, traceId, spanId). Vacio = texto plano.
      console: ${LOG_FORMAT:logstash}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.vidacruz: ${LOG_LEVEL_APP:INFO}

# ---------------------------------------------------------------------------
# Propiedades de negocio / operacion de triage
# ---------------------------------------------------------------------------
triage:
  security:
    api-key-header: X-API-Key
    api-key: ${TRIAGE_API_KEY}
  kafka:
    topic: ${TRIAGE_KAFKA_TOPIC:triaje.eventos}
    event-version: 1
  # RN-02: SLA en minutos por nivel (sobrescribibles para probar el escalamiento sin esperar decenas de minutos).
  # El valor POR DEFECTO no se escribe aqui: vive en NivelTriaje.slaPorDefectoMinutos() (unica fuente de verdad). Una variable
  # vacia o ausente deja ese valor; TriageSlaProperties lo completa.
  # El SLA se congela en el paciente al registrarlo: cambiar esto solo afecta a pacientes NUEVOS.
  # RF-03: el proceso de fondo evalua cada `intervalo-evaluacion` los pacientes REGISTRADO cuyo SLA vencio.
  sla:
    habilitado: ${TRIAGE_SLA_HABILITADO:true}
    intervalo-evaluacion: ${TRIAGE_SLA_INTERVALO_EVALUACION:PT30S}
    lote: ${TRIAGE_SLA_LOTE:100}
    minutos:
      CRITICO: ${TRIAGE_SLA_CRITICO:}
      URGENTE: ${TRIAGE_SLA_URGENTE:}
      URGENTE_2: ${TRIAGE_SLA_URGENTE_2:}
      NO_URGENTE: ${TRIAGE_SLA_NO_URGENTE:}
      NO_URGENTE_2: ${TRIAGE_SLA_NO_URGENTE_2:}
  # RN-01: quejas administrativas (nivel 5). Lista del enunciado; la queja es administrativa si CONTIENE alguna
  # frase (sin tildes ni mayusculas). Para cambiarla hay que redefinir la lista completa.
  clasificacion:
    quejas-administrativas:
      - documentos
      - recolección de resultados
      - renovación de recetario
      - vacunación
      - seguimiento
  # Publicador del Transactional Outbox (outbox_eventos -> Kafka). FOR UPDATE SKIP LOCKED: seguro con varias replicas.
  outbox:
    habilitado: ${TRIAGE_OUTBOX_HABILITADO:true}
    intervalo: ${TRIAGE_OUTBOX_INTERVALO:PT1S}
    batch-size: ${TRIAGE_OUTBOX_BATCH:100}
    max-intentos: ${TRIAGE_OUTBOX_MAX_INTENTOS:10}
    backoff-inicial: ${TRIAGE_OUTBOX_BACKOFF_INICIAL:PT2S}     # espera tras el 1.er fallo; se duplica en cada intento
    backoff-maximo: ${TRIAGE_OUTBOX_BACKOFF_MAXIMO:PT1M}
    timeout-publicacion: ${TRIAGE_OUTBOX_TIMEOUT:PT10S}
  # RF-06: alertas de escalamiento al equipo medico (consumidor Kafka -> SSE + webhook)
  alertas:
    consumidor:
      habilitado: ${TRIAGE_ALERTAS_HABILITADO:true}
      group-id: ${TRIAGE_ALERTAS_GROUP:triage-alertas}
      reintentos: ${TRIAGE_ALERTAS_REINTENTOS:4}               # antes de enviar a la DLT
      timeout-procesamiento: ${TRIAGE_ALERTAS_TIMEOUT:30s}     # tope de espera por evento en el hilo del consumidor (ADR 0004)
      backoff-inicial: ${TRIAGE_ALERTAS_BACKOFF_INICIAL:PT1S}
      backoff-maximo: ${TRIAGE_ALERTAS_BACKOFF_MAXIMO:PT10S}
      capacidad-deduplicacion: ${TRIAGE_ALERTAS_DEDUP:10000}   # eventId recordados en memoria
    sse:
      heartbeat: ${TRIAGE_ALERTAS_SSE_HEARTBEAT:PT15S}
    webhook:
      url: ${TRIAGE_ALERTAS_WEBHOOK_URL:}                      # vacio = deshabilitado
      timeout: ${TRIAGE_ALERTAS_WEBHOOK_TIMEOUT:PT3S}
      intentos: ${TRIAGE_ALERTAS_WEBHOOK_INTENTOS:3}
      espera-reintento: ${TRIAGE_ALERTAS_WEBHOOK_ESPERA:PT0.5S}
      ventana-circuit-breaker: 10
      umbral-fallos: 50
      espera-circuito-abierto: PT30S
  # RF-05: reporte de operacion por hora. Las horas se agrupan en esta zona (IANA) y el rango maximo evita consultas enormes.
  reportes:
    zona-horaria: ${TRIAGE_REPORTES_ZONA:America/Bogota}
    rango-maximo-dias: ${TRIAGE_REPORTES_RANGO_MAXIMO_DIAS:31}
